name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:

# The host gates are exercised against a real WordPress 7.0, so CI provisions
# one. The build/CI of agent-authored plugins themselves happens in the
# Anthropic sandbox, never here — this workflow only validates THIS plugin.

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax-check every PHP file
        run: |
          find caw-plugin-builder/includes \
               caw-plugin-builder/mu-plugin \
               caw-plugin-builder/caw-plugin-builder.php \
               caw-plugin-builder/uninstall.php \
               tests \
               -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install dependencies
        working-directory: caw-plugin-builder
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        working-directory: caw-plugin-builder
        run: vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress

  integration:
    name: Integration tests (WordPress 7.0)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, mbstring, dom, curl, intl, gd
          tools: composer
          coverage: none

      - name: Install dependencies
        working-directory: caw-plugin-builder
        run: composer install --no-interaction --prefer-dist

      - name: Install WP-CLI
        run: |
          curl -sSL -o "$HOME/wp" \
            https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$HOME/wp"
          echo "$HOME" >> "$GITHUB_PATH"

      - name: Provision WordPress 7.0
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/wp70.zip \
            https://github.com/WordPress/WordPress/archive/refs/tags/7.0.zip
          unzip -q /tmp/wp70.zip -d /tmp/wpsrc
          mkdir -p "$HOME/wordpress"
          cp -a /tmp/wpsrc/WordPress-7.0/. "$HOME/wordpress/"
          cd "$HOME/wordpress"
          wp config create \
            --dbname=wp_test --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1:3306 --skip-check
          wp core install \
            --url=http://localhost --title="CAW CI" \
            --admin_user=admin --admin_password=admin \
            --admin_email=ci@example.com --skip-email
          echo "CAW_WP_PATH=$HOME/wordpress" >> "$GITHUB_ENV"

      - name: Activate the plugin
        run: |
          ln -s "$GITHUB_WORKSPACE/caw-plugin-builder" \
                "$HOME/wordpress/wp-content/plugins/caw-plugin-builder"
          cd "$HOME/wordpress"
          wp plugin activate caw-plugin-builder

      - name: Run the test suite
        run: caw-plugin-builder/vendor/bin/phpunit -c phpunit.xml.dist
